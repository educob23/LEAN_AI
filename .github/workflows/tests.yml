name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    # Offline unit tests: parser, proof extraction, verdict logic and the identity check.
    # No Lean toolchain or model weights are needed (see tests/conftest.py).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q tests
